<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="description" content="康軒版國小五年級上學期自然互動學習網站：五上自然探究實驗室。" />
  <meta name="application-name" content="五上自然探究實驗室" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css?v=1.0.0" />
  <title>五上自然探究實驗室｜康軒版</title>
</head>
<body>
  <header class="topbar">
    <button class="brand" id="homeBrand" type="button" aria-label="回首頁">
      <span class="brand-mark" aria-hidden="true">🧪</span>
      <span><small>國小五上・自然科・康軒版</small><strong>自然探究實驗室 <em>v1.0</em></strong></span>
    </button>
    <div class="status-strip" aria-label="學習狀態">
      <span>⭐ <b id="stars">0</b></span>
      <span class="hide-narrow">🔥 <b id="streak">1</b> 天</span>
      <button class="profile-chip" id="profileBtn" type="button">👤 <b id="profileName">小小科學家</b></button>
    </div>
  </header>

  <main id="mainView" class="main-view" tabindex="-1"></main>

  <nav class="bottom-nav" aria-label="主要導覽">
    <button data-nav="home" class="nav-item active" type="button"><span>🏠</span><b>首頁</b></button>
    <button data-nav="units" class="nav-item" type="button"><span>📚</span><b>單元</b></button>
    <button data-nav="lab" class="nav-item" type="button"><span>🔬</span><b>實驗</b></button>
    <button data-nav="games" class="nav-item" type="button"><span>🎮</span><b>遊戲</b></button>
    <button data-nav="rescue" class="nav-item" type="button"><span>🛟</span><b>救援</b></button>
    <button data-nav="exams" class="nav-item" type="button"><span>📝</span><b>段考</b></button>
  </nav>

  <dialog id="profileDialog" class="small-dialog">
    <form method="dialog" class="dialog-card compact-profile" id="profileForm">
      <button class="icon-close" value="cancel" aria-label="關閉">×</button>
      <div class="profile-title"><span>👤</span><div><small>不擋住學習的簡易設定</small><h2>研究員名字</h2></div></div>
      <label class="field-label" for="nameInput">名字或暱稱</label>
      <input id="nameInput" maxlength="12" autocomplete="nickname" placeholder="例如：小安" />
      <p class="field-help">不需要帳號、密碼或 PIN；進度只存在這個瀏覽器。</p>
      <div class="row-actions"><button class="btn secondary" value="cancel">稍後</button><button class="btn primary" id="saveProfile" value="default">儲存</button></div>
    </form>
  </dialog>

  <dialog id="lessonDialog" class="wide-dialog"><div class="dialog-card lesson-shell"><button class="icon-close" data-close="lesson" aria-label="關閉">×</button><div id="lessonContent"></div></div></dialog>
  <dialog id="examDialog" class="wide-dialog"><div class="dialog-card exam-shell"><button class="icon-close" data-close="exam" aria-label="關閉">×</button><div id="examContent"></div></div></dialog>
  <dialog id="gameDialog" class="wide-dialog"><div class="dialog-card game-shell"><button class="icon-close" data-close="game" aria-label="關閉">×</button><div id="gameContent"></div></div></dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./data.js?v=1.0.0"></script>
  <script src="./app.js?v=1.0.0"></script>
</body>
</html>
